<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Same Day Two Screens</title>

<style>
    body, html {

        /* to make the image cover the entire screen */
      
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: black;
      font-family: Arial, sans-serif;
    }
   
    .fullscreen {
      width: 100vw;
      height: 100vh;  
      display: block;
      object-fit: cover;
    }

    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 10;
      transition: opacity 0.5s ease;
    }
    </style>

</head>

 <body>
    
   
    <img src="laptop.png" alt="the laptop screen where video will be displayed" class="fullscreen">
  
    <!-- placeholders for before the filming -->
    <div class="laptop">
    <video src="placeholder.mp4" controls></video> 
    </div>

    </body>
</html>
